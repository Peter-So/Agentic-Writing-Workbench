upstream ccr_agentic_writing_workbench {
    server 127.0.0.1:17861;
    keepalive 8;
}

server {
    listen 80;
    server_name ccr.joysim.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ccr.joysim.cn;

    ssl_certificate /usr/local/nginx/conf-new/cert/joysim.cn.pem;
    ssl_certificate_key /usr/local/nginx/conf-new/cert/joysim.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /usr/local/nginx/logs/ccr.joysim.cn_access.log combined;
    error_log /usr/local/nginx/logs/ccr.joysim.cn_error.log warn;
    client_max_body_size 50m;

    location / {
        proxy_pass http://ccr_agentic_writing_workbench;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }
}
